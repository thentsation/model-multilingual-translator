services:
  app:
    image: ${APP_IMAGE:-gru.ocir.io/grun5vjqis7z/model-multilingual-translator:latest}
    pull_policy: missing
    container_name: model-multilingual-translator
    restart: unless-stopped
    expose:
      - '8501'
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.model-multilingual-translator.rule=Host(`translator.137-131-175-7.sslip.io`)
      - traefik.http.routers.model-multilingual-translator.entrypoints=websecure
      - traefik.http.routers.model-multilingual-translator.tls.certresolver=letsencrypt
      - traefik.http.services.model-multilingual-translator.loadbalancer.server.port=8501

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
