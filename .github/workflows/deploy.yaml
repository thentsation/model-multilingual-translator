name: Deploy

on:
  workflow_dispatch:

jobs:
  demo-run:
    name: Smoke test the published image (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published image and check the Streamlit health endpoint
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker run -d --name translator-smoke -p 8501:8501 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health || echo "000")
            [ "$CODE" = "200" ] && echo "OK: health respondeu 200" && exit 0
            echo "Tentativa $i: health respondeu $CODE"
            sleep 3
          done
          docker logs translator-smoke
          exit 1
